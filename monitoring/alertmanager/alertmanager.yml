global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    webhook_configs:
      # Local bridge transforms Alertmanager JSON → Discord embeds
      - url: "http://127.0.0.1:9094"
        send_resolved: true
        max_alerts: 0

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "instance"]
