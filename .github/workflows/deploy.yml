name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run unit tests
        working-directory: server
        run: npm test

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install production server deps
        working-directory: server
        run: npm ci --omit=dev

      - name: Pack release artifact
        run: |
          mkdir -p release/server release/client/dist release/deploy
          rsync -a --exclude node_modules --exclude .git server/ release/server/
          rsync -a server/node_modules/ release/server/node_modules/
          rsync -a client/dist/ release/client/dist/
          rsync -a deploy/ release/deploy/
          tar -czf url-shortener-release.tgz -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: url-shortener-release.tgz
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH_PORT="${{ secrets.SSH_PORT }}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release to VPS
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" \
            url-shortener-release.tgz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/url-shortener-release.tgz"

      - name: Remote deploy & restart
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "APP_ROOT='${{ secrets.DEPLOY_PATH }}' bash -s" <<'EOF'
          set -euo pipefail
          APP_ROOT="${APP_ROOT:-/var/www/url-shortener}"
          mkdir -p "$APP_ROOT" /var/log/url-shortener
          tar -xzf /tmp/url-shortener-release.tgz -C "$APP_ROOT"
          cd "$APP_ROOT/server"
          if [[ ! -f "$APP_ROOT/.env" && ! -f .env ]]; then
            echo "Missing .env on VPS at $APP_ROOT/.env" >&2
            exit 1
          fi
          if [[ -f "$APP_ROOT/.env" && ! -f .env ]]; then
            ln -sfn "$APP_ROOT/.env" .env
          fi
          npm run migrate
          pm2 startOrReload "$APP_ROOT/deploy/ecosystem.config.js" --update-env
          pm2 save
          EOF

      - name: Health check
        run: |
          set -euo pipefail
          HEALTH_URL="${{ secrets.HEALTH_URL }}"
          if [[ -z "$HEALTH_URL" ]]; then
            HEALTH_URL="https://${{ secrets.DOMAIN }}/api/health"
          fi
          echo "Checking $HEALTH_URL"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$HEALTH_URL" | grep -q '"status":"ok"'; then
              echo "Health OK"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "Health check failed" >&2
          exit 1

  notify:
    name: Discord notify
    needs: [ci, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CI_RESULT: ${{ needs.ci.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request

          ci = os.environ["CI_RESULT"]
          deploy = os.environ["DEPLOY_RESULT"]
          actor = os.environ["ACTOR"]
          sha = os.environ["SHA"]
          run_url = os.environ["RUN_URL"]
          commit = (os.environ.get("COMMIT_MSG") or "").splitlines()[0][:180]

          if ci == "success" and deploy == "success":
              title = "Deploy succeeded"
              color = 5763719
              desc = f"**By:** {actor}\n**Commit:** {commit}\n**SHA:** `{sha}`"
          else:
              title = "Deploy failed"
              color = 15548997
              desc = f"**By:** {actor}\n**CI:** {ci} · **Deploy:** {deploy}\nOpen the run log to debug."

          body = {
              "embeds": [
                  {
                      "title": title,
                      "color": color,
                      "description": desc,
                      "url": run_url,
                  }
              ]
          }
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print("discord_status", resp.status)
          PY
