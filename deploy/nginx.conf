# Nginx site config for URL shortener
# Replace YOUR_DOMAIN with your real domain, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/url-shortener
#   sudo ln -sf /etc/nginx/sites-available/url-shortener /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# After DNS points here, run certbot:
#   sudo certbot --nginx -d YOUR_DOMAIN

upstream url_shortener_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream grafana_upstream {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot will add ACME + HTTPS redirect here
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # Managed by Certbot (paths below are placeholders until certbot runs)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/url-shortener/client/dist;
    index index.html;

    # Static React build
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health (do NOT expose /metrics publicly)
    location /api/ {
        proxy_pass http://url_shortener_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Short-link redirects
    location /r/ {
        proxy_pass http://url_shortener_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicitly deny public metrics if someone probes /metrics or /api/metrics
    location = /metrics {
        deny all;
        return 404;
    }

    location = /api/metrics {
        deny all;
        return 404;
    }

    # Grafana behind HTTPS (Viewer account for lecturer)
    location /grafana/ {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
