# Temporary HTTP-only Nginx config — use BEFORE certbot.
# After DNS works:
#   sudo sed "s/YOUR_DOMAIN/$DOMAIN/g" deploy/nginx-http-only.conf \
#     | sudo tee /etc/nginx/sites-available/url-shortener
#   sudo ln -sf /etc/nginx/sites-available/url-shortener /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN
# Then switch to (or let certbot rewrite) deploy/nginx.conf.

upstream url_shortener_app {
    server 127.0.0.1:3080;
    keepalive 16;
}

upstream grafana_upstream {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/url-shortener/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://url_shortener_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /r/ {
        proxy_pass http://url_shortener_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics { deny all; return 404; }
    location = /api/metrics { deny all; return 404; }

    location /grafana/ {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
